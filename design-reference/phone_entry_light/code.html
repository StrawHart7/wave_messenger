<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom styles for select to hide default arrow and use custom one */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background h-screen w-full flex justify-center items-center overflow-hidden">
<!-- Mobile Device Mockup Container -->
<div class="relative w-full h-full max-w-[430px] max-h-[932px] bg-surface flex flex-col mx-auto overflow-hidden shadow-2xl md:rounded-[3rem] md:border-[14px] md:border-black md:h-[795px]">
<!-- Status Bar (Simulated) -->
<div class="w-full flex justify-between items-center px-6 pt-3 pb-2 z-50 bg-surface">
<div class="font-timestamp text-timestamp font-medium tracking-wide">9:41</div>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[16px] leading-none" data-weight="fill" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-weight="fill" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Top App Bar -->
<header class="w-full h-list-item-height px-edge-margin flex items-center justify-between z-40 bg-surface">
<button class="w-10 h-10 flex items-center justify-start text-primary active:opacity-70 transition-opacity">
<!-- Ghost button for back -->
<span class="font-button-text text-button-text">Cancel</span>
</button>
<h1 class="font-nav-title text-nav-title text-on-background text-center flex-1 pr-10">Phone number</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-edge-margin pt-6 overflow-y-auto">
<div class="text-center mb-10">
<p class="font-message-body text-message-body text-on-surface-variant">
                    Please confirm your country code and enter your phone number.
                </p>
</div>
<!-- Input Form Area -->
<div class="w-full space-y-0 relative">
<!-- Top / Bottom separator container -->
<div class="border-y border-outline-variant w-full bg-surface-container-lowest">
<!-- Country Selector -->
<div class="relative w-full h-12 flex items-center border-b border-outline-variant">
<select class="w-full h-full pl-0 pr-10 py-0 bg-transparent border-none text-chat-name font-chat-name text-primary focus:ring-0 cursor-pointer outline-none z-10" id="countrySelect">
<option selected="" value="IT">Italy</option>
<option value="US">United States</option>
<option value="UK">United Kingdom</option>
<option value="FR">France</option>
<option value="DE">Germany</option>
<option value="ES">Spain</option>
</select>
<div class="absolute right-0 inset-y-0 flex items-center pr-2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex w-full h-12 items-center">
<!-- Country Code Display -->
<div class="flex items-center justify-center border-r border-outline-variant pr-4 pl-0 h-full">
<span class="font-chat-name text-chat-name text-on-surface-variant w-12 text-center" id="countryCodeDisplay">+39</span>
</div>
<!-- Number Field -->
<div class="flex-1 h-full relative">
<input autocomplete="tel" autofocus="" class="w-full h-full bg-transparent border-none px-4 py-0 font-chat-name text-chat-name text-on-background placeholder-on-surface-variant/50 focus:ring-0 outline-none" id="phoneNumberInput" placeholder="Phone number" type="tel"/>
</div>
</div>
</div>
</div>
<!-- Contextual Information / Legal -->
<div class="mt-8 text-center px-4">
<p class="font-timestamp text-timestamp text-on-surface-variant">
                    Carrier SMS charges may apply. By tapping "Next", you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
<div class="flex-1"></div> <!-- Spacer to push button down -->
</main>
<!-- Bottom Action Area -->
<div class="w-full px-edge-margin pb-safe pt-4 mb-8 bg-surface">
<button class="w-full bg-primary-container text-on-primary h-12 rounded-full font-button-text text-button-text flex items-center justify-center transition-transform active:scale-95 disabled:opacity-50 disabled:active:scale-100" disabled="" id="nextBtn">
                Next
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const countrySelect = document.getElementById('countrySelect');
            const countryCodeDisplay = document.getElementById('countryCodeDisplay');
            const phoneInput = document.getElementById('phoneNumberInput');
            const nextBtn = document.getElementById('nextBtn');

            // Map of countries to codes (simplified for example)
            const countryCodes = {
                'IT': '+39',
                'US': '+1',
                'UK': '+44',
                'FR': '+33',
                'DE': '+49',
                'ES': '+34'
            };

            // Update country code when select changes
            countrySelect.addEventListener('change', (e) => {
                const code = countryCodes[e.target.value] || '+1';
                countryCodeDisplay.textContent = code;
                phoneInput.focus();
            });

            // Basic validation to enable 'Next' button
            phoneInput.addEventListener('input', (e) => {
                // Remove non-numeric characters for check
                const numericValue = e.target.value.replace(/\D/g, '');
                
                // Simple check: length greater than 5 enables the button
                if (numericValue.length > 5) {
                    nextBtn.removeAttribute('disabled');
                } else {
                    nextBtn.setAttribute('disabled', 'true');
                }
            });

            // Action on next button
            nextBtn.addEventListener('click', () => {
                if(!nextBtn.hasAttribute('disabled')){
                    // Simulate loading state briefly
                    const originalText = nextBtn.textContent;
                    nextBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                    setTimeout(() => {
                        nextBtn.textContent = originalText;
                        alert('Proceeding to next step (Verification Code) with ' + countryCodeDisplay.textContent + ' ' + phoneInput.value);
                    }, 800);
                }
            });
            
            // Initial focus
            setTimeout(() => phoneInput.focus(), 300);
        });
    </script>
</body></html>
